<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Larz · Invoice & Receipt Studio</title><link rel="stylesheet" href="src/style.css"></head>
<body><aside class="sidebar"><a class="brand" href="#" aria-label="Larz"><img src="assets/larz-logo.png" alt="LARZ"></a><nav><button data-page="editor" class="active">＋ Create document</button><button data-page="inventory">▦ Inventory</button><button data-page="history">▤ Saved documents</button><button data-page="settings">⚙ Business settings</button></nav><div class="local-note"><span class="dot"></span> Shared workspace<p>Saved records sync through Supabase. Unfinished drafts stay on this browser.</p><button id="export">Export backup ↗</button><label class="import">Import backup<input id="import" type="file" accept="application/json"></label><form class="sign-out-form" method="post" action="/logout"><button class="secondary" type="submit">Sign out</button></form></div></aside>
<main><header class="app-header"><div class="header-title"><h1 id="page-title">Create a document</h1><span id="save-status" role="status">Ready</span></div></header>
<section id="editor" class="page"><div class="toolbar"><div class="segmented"><button id="invoice-mode">Invoice</button><button id="receipt-mode">Receipt</button></div><button id="new-doc" class="secondary">New document</button></div><div class="workspace"><form id="document-form" class="editor-card" novalidate></form><div class="preview-wrap"><div class="preview-label">LIVE PREVIEW <span>A4 DOCUMENT</span></div><article id="preview" class="paper"></article><div class="preview-actions"><button id="confirm-sale" class="primary">Confirm sale</button><button id="cancel-sale" class="secondary" hidden>Cancel sale</button><button id="save-doc" class="secondary">Save document</button><button id="print" class="primary">Save PDF ↓</button></div></div></div></section>
<section id="inventory" class="page" hidden><div class="section-heading"><p>Shared products and stock</p><div><button id="refresh-stock" class="secondary">Refresh</button><button id="add-product" class="primary">Add product</button></div></div><input id="product-search" placeholder="Search product name or SKU" aria-label="Search inventory"><form id="product-form" class="settings-card" hidden></form><div id="inventory-list"></div><h2>Recent stock movements</h2><div id="movement-list"></div></section><section id="history" class="page" hidden><div class="section-heading"><p>Shared saved documents. Confirm a sale to deduct stock.</p><input id="search" placeholder="Search by customer or number" aria-label="Search documents"></div><div id="history-list"></div></section>
<section id="settings" class="page" hidden><form id="settings-form" class="settings-card"></form></section><div id="toast" role="status"></div></main><script src="src/core.js"></script><script src="assets/vendor/jspdf.umd.min.js"></script><script src="src/pdf.js"></script><script src="src/app.js"></script><script src="src/cloud.js"></script></body></html>
